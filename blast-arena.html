<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b6cf0">
<title>BLAST ARENA</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1b6cf0; --blue2:#0f55c8; --dark:#23263a; --dark2:#15172a; --line:#111322;
  --yellow:#ffd21f; --yellow2:#e3a700; --pink:#ff3fb3; --green:#48e06a; --coin:#f8c21c; --gem:#56e07a; --pp:#ff3ea5; --red:#ff4040;
  --fh:'Black Han Sans','Lilita One',sans-serif; --fb:'Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--blue);font-family:var(--fb);color:#fff;touch-action:none}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block}
.bg{position:absolute;inset:0;z-index:0;
 background:linear-gradient(160deg,#2f8bff 0%,#1b6cf0 45%,#0d4fc2 100%);}
.bg::before{content:"";position:absolute;inset:-20%;opacity:.13;
 background-image:radial-gradient(circle at 10px 10px,#fff 6px,transparent 7px),radial-gradient(circle at 70px 60px,#fff 4px,transparent 5px);
 background-size:120px 120px;transform:rotate(-12deg)}
.ui{position:absolute;inset:0;z-index:1}
/* chunky button */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
 font-family:var(--fh);font-size:18px;letter-spacing:.5px;color:#fff;border:3px solid var(--line);border-radius:10px;
 background:linear-gradient(#3a3e5c,#23263a);box-shadow:0 5px 0 var(--line),0 8px 10px rgba(0,0,0,.3);padding:8px 16px;
 text-shadow:0 2px 0 rgba(0,0,0,.6);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.y{background:linear-gradient(#ffe45c,#f5b800);color:#3a2800;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.g{background:linear-gradient(#73f08a,#2bc84b);color:#083a14;text-shadow:none}
.btn.p{background:linear-gradient(#ff67c7,#e020a0)}
.btn.r{background:linear-gradient(#ff6a6a,#d82020)}
.btn.b{background:linear-gradient(#4fa0ff,#1a62d8)}
.btn:disabled,.btn.off{filter:grayscale(.8) brightness(.7);pointer-events:none}
.sq{width:78px;height:72px;flex-direction:column;font-size:15px;padding:4px}
.sq .ico{width:40px;height:34px;display:block}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(10,12,30,.75);border:3px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-family:var(--fh);font-size:18px;box-shadow:0 3px 0 var(--line)}
.pill .ico{width:26px;height:26px}
.ico{display:inline-block;flex:none}
/* top bar */
.topbar{position:absolute;top:8px;left:8px;right:8px;display:flex;align-items:center;gap:8px;z-index:3}
.topbar .sp{flex:1}
.backbtn{width:64px;height:54px;font-size:30px;padding:0}
.homebtn{width:64px;height:54px;padding:0}
.homebtn .ico{width:34px;height:30px}
.title{font-family:var(--fh);font-size:34px;letter-spacing:1px;text-shadow:0 3px 0 var(--line),0 6px 10px rgba(0,0,0,.4)}
.title b{color:var(--yellow)}
/* HOME */
#homeCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.hl{position:absolute;left:10px;top:78px;display:flex;flex-direction:column;gap:12px;z-index:3}
.hr{position:absolute;right:10px;top:78px;display:flex;flex-direction:column;gap:12px;z-index:3;align-items:flex-end}
.hbl{position:absolute;left:10px;bottom:12px;z-index:3}
.hbr{position:absolute;right:10px;bottom:12px;display:flex;align-items:flex-end;gap:10px;z-index:3}
.profile{display:flex;align-items:center;gap:8px;background:rgba(10,12,30,.75);border:3px solid var(--line);border-radius:12px;padding:4px 10px 4px 4px;box-shadow:0 4px 0 var(--line)}
.profile .av{width:46px;height:46px;border-radius:9px;border:3px solid var(--line);background:#2a2d4a;overflow:hidden}
.profile .av canvas{width:100%;height:100%}
.profile .nm{font-family:var(--fh);font-size:18px;line-height:1}
.profile .tr{display:flex;align-items:center;gap:4px;font-family:var(--fh);font-size:16px;color:var(--yellow)}
.badgeTop{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:3;top:88px}
.rank{width:54px;height:54px;border-radius:12px;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fh);line-height:1;box-shadow:0 4px 0 var(--line)}
.rank small{font-size:9px;letter-spacing:1px;opacity:.9}
.rank b{font-size:22px}
.fname{font-family:var(--fh);font-size:26px;text-shadow:0 3px 0 var(--line);transform:rotate(-3deg)}
.passBox{display:flex;align-items:center;gap:10px;background:linear-gradient(#ffe45c,#f5b800);border:3px solid var(--line);border-radius:12px;padding:6px 12px 6px 8px;box-shadow:0 5px 0 var(--line);color:#3a2800;cursor:pointer;min-width:220px}
.passBox .t{font-family:var(--fh);font-size:18px;line-height:1}
.bar{height:16px;background:#2a2000;border:2px solid var(--line);border-radius:999px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(#fff6a8,#ffc800);width:0%}
.bar span{position:absolute;inset:0;font-family:var(--fh);font-size:12px;line-height:12px;text-align:center;color:#fff;text-shadow:0 1px 0 #000}
.eventSel{display:flex;align-items:center;gap:10px;background:rgba(10,12,30,.8);border:3px solid var(--line);border-radius:12px;padding:6px 14px 6px 8px;box-shadow:0 5px 0 var(--line);cursor:pointer;min-width:240px}
.eventSel .mi{width:50px;height:50px}
.eventSel .en{font-family:var(--fh);font-size:20px;line-height:1.05}
.eventSel .em{font-size:13px;color:#9fd0ff;font-weight:700}
.eventSel .et{font-size:11px;color:#ffd21f;font-weight:700}
.playbtn{width:150px;height:76px;font-size:34px}
.chatbtn{display:none}
.chatbtn.show{display:inline-flex}
.party{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);display:flex;gap:16px;z-index:2;pointer-events:none}
/* FIGHTERS GRID */
.grid{position:absolute;top:72px;left:0;right:0;bottom:0;overflow-y:auto;padding:8px 10px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;z-index:2;align-content:start}
.card{position:relative;background:#101230;border:3px solid var(--line);border-radius:12px;box-shadow:0 5px 0 var(--line);overflow:hidden;cursor:pointer;aspect-ratio:0.78;display:flex;flex-direction:column}
.card.lock{filter:grayscale(1) brightness(.55)}
.card .art{flex:1;position:relative;overflow:hidden}
.card .art canvas{width:100%;height:100%;display:block}
.card .th{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:4px 6px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.card .rk{font-family:var(--fh);font-size:13px;padding:2px 7px;border-radius:7px;border:2px solid var(--line)}
.card .tp{font-family:var(--fh);font-size:15px;color:var(--yellow);text-shadow:0 2px 0 #000;display:flex;align-items:center;gap:3px}
.card .nm{position:absolute;right:6px;bottom:4px;font-family:var(--fh);font-size:17px;text-shadow:0 2px 0 #000,0 0 6px #000}
.card .ft{height:32px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--fh);font-size:14px;border-top:3px solid var(--line)}
.card .pw{position:absolute;left:4px;bottom:28px;width:34px;height:34px;border-radius:50%;border:3px solid var(--line);background:radial-gradient(#ff7fe0,#c21a8e);font-family:var(--fh);font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--line);z-index:2}
.card .rar{position:absolute;left:0;top:34px;font-size:10px;font-weight:900;padding:2px 8px;border-radius:0 8px 8px 0;background:rgba(0,0,0,.55)}
/* DETAIL */
.detail{position:absolute;inset:72px 0 0 0;display:grid;grid-template-columns:1fr 1.2fr 1fr;z-index:2}
.dl{padding:10px 14px}
.dname{display:inline-block;background:var(--yellow);color:#111;font-family:var(--fh);font-size:34px;padding:4px 40px 4px 14px;transform:skew(-10deg);line-height:1;box-shadow:0 5px 0 var(--line)}
.dtitle{font-family:var(--fh);font-size:16px;color:#dbe9ff;margin-top:8px}
.drar{display:inline-block;margin-top:6px;font-size:12px;font-weight:900;padding:3px 10px;border-radius:8px;border:2px solid var(--line)}
.ddesc{margin-top:14px;font-size:14px;line-height:1.5;color:#e9f1ff;background:rgba(0,0,0,.25);padding:10px;border-radius:10px;border:2px solid rgba(0,0,0,.3)}
.dc{position:relative}
#detailCanvas{width:100%;height:100%;display:block}
.dr{padding:10px 14px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.statbox{background:rgba(5,8,30,.8);border:3px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 4px 0 var(--line)}
.stat{display:flex;align-items:center;gap:8px;background:#1a1d3b;border:2px solid var(--line);border-radius:8px;padding:5px 8px;margin-top:6px}
.stat .k{font-size:11px;font-weight:900;color:#9fb8ff;line-height:1}
.stat .v{font-family:var(--fh);font-size:17px;line-height:1.1}
.stat .ic{width:30px;height:30px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center}
.powerline{display:flex;align-items:center;gap:8px;font-family:var(--fh);font-size:16px}
.powerline .pw{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:radial-gradient(#ff7fe0,#c21a8e);display:flex;align-items:center;justify-content:center;font-size:19px}
.upg{display:flex;flex-direction:column;align-items:stretch;gap:2px;font-size:14px}
.upg small{font-size:12px;opacity:.9}
/* EVENTS */
.tabs{position:absolute;bottom:0;left:0;right:0;display:flex;z-index:3;background:rgba(5,8,30,.9);border-top:3px solid var(--line)}
.tab{flex:1;text-align:center;font-family:var(--fh);font-size:17px;padding:10px 4px;cursor:pointer;color:#8fa6d8}
.tab.on{color:#fff;background:rgba(255,255,255,.08);border-bottom:4px solid var(--yellow)}
.evgrid{position:absolute;top:72px;left:0;right:0;bottom:50px;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;z-index:2;align-content:start}
.ev{position:relative;border:3px solid var(--line);border-radius:12px;box-shadow:0 5px 0 var(--line);cursor:pointer;overflow:hidden;height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.ev.on{outline:4px solid var(--yellow)}
.ev.lock{filter:grayscale(.9) brightness(.6)}
.ev .mi{position:absolute;left:10px;top:10px;width:56px;height:56px}
.ev .tm{position:absolute;right:8px;top:8px;font-size:11px;font-weight:900;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:8px;color:#ffd21f}
.ev .en{font-family:var(--fh);font-size:22px;text-shadow:0 2px 0 #000}
.ev .em{font-size:13px;font-weight:700;opacity:.9}
.ev .ed{font-size:11px;opacity:.8;margin-top:2px}
/* ROAD */
.road{position:absolute;top:72px;left:0;right:0;bottom:0;overflow-y:auto;padding:14px 10px 40px;z-index:2}
.rnode{display:flex;align-items:center;gap:12px;margin:0 auto 10px;max-width:520px;background:rgba(5,8,30,.75);border:3px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 4px 0 var(--line)}
.rnode.done{opacity:.55}
.rnode.ready{outline:3px solid var(--yellow);animation:pulse 1s infinite alternate}
@keyframes pulse{from{box-shadow:0 4px 0 var(--line)}to{box-shadow:0 4px 0 var(--line),0 0 18px #ffd21f}}
.rnode .m{font-family:var(--fh);font-size:20px;color:var(--yellow);width:80px;display:flex;align-items:center;gap:4px}
.rnode .rw{flex:1;display:flex;align-items:center;gap:8px;font-family:var(--fh);font-size:17px}
.rnode .rw .ico{width:30px;height:30px}
/* SHOP */
.shopgrid{position:absolute;top:72px;left:0;right:0;bottom:0;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;z-index:2;align-content:start}
.sitem{background:rgba(5,8,30,.8);border:3px solid var(--line);border-radius:12px;box-shadow:0 5px 0 var(--line);padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.sitem .big{width:64px;height:64px}
.sitem .n{font-family:var(--fh);font-size:17px}
.sitem .d{font-size:12px;opacity:.85}
/* MODAL */
.modal{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
.modal.on{display:flex}
.mbox{background:linear-gradient(#2a66d8,#143f9b);border:4px solid var(--line);border-radius:16px;box-shadow:0 8px 0 var(--line),0 20px 40px rgba(0,0,0,.5);min-width:300px;max-width:92vw;max-height:88vh;overflow:auto;padding:14px}
.mbox h2{font-family:var(--fh);font-size:26px;margin-bottom:8px;text-shadow:0 2px 0 var(--line)}
.row{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:2px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.row .av{width:40px;height:40px;border-radius:8px;border:2px solid var(--line);background:#1a1d3b;overflow:hidden;flex:none}
.row .av canvas{width:100%;height:100%}
.row .nm{font-family:var(--fh);font-size:16px;flex:1}
.row .st{font-size:11px;font-weight:700;color:#9ad0ff}
.chatlog{height:220px;overflow-y:auto;background:rgba(0,0,0,.35);border:2px solid var(--line);border-radius:10px;padding:8px;font-size:13px;margin-bottom:8px}
.chatlog div{margin-bottom:4px}.chatlog b{color:#ffd21f}
.chatin{display:flex;gap:6px}
.chatin input{flex:1;border:2px solid var(--line);border-radius:8px;padding:8px;font-family:var(--fb);font-size:14px;outline:none}
/* LUCKY DROP */
.dropStage{width:280px;height:280px;position:relative;display:flex;align-items:center;justify-content:center;margin:0 auto}
.dropStage canvas{width:100%;height:100%}
.dropRes{text-align:center;font-family:var(--fh);font-size:22px;min-height:60px}
/* BATTLE */
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;background:#0a2a5c}
.hud{position:absolute;inset:0;z-index:2;pointer-events:none}
.hud .lv{position:absolute;left:8px;top:8px;pointer-events:auto}
.hud .top{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px}
.score{display:flex;align-items:center;gap:8px;background:rgba(5,8,30,.8);border:3px solid var(--line);border-radius:12px;padding:4px 14px;font-family:var(--fh);font-size:24px;box-shadow:0 4px 0 var(--line)}
.score .b{color:#5ab0ff}.score .r{color:#ff6060}.score .c{color:#fff;font-size:16px;min-width:70px;text-align:center}
.banner{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-family:var(--fh);font-size:30px;text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.6);text-align:center;white-space:nowrap}
.stick{position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(0,0,0,.18);border:3px solid rgba(255,255,255,.25);pointer-events:none;display:none}
.stick i{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.8)}
.sbtn{position:absolute;right:22px;bottom:200px;width:88px;height:88px;border-radius:50%;border:4px solid var(--line);background:#5a3a00;display:none;align-items:center;justify-content:center;font-family:var(--fh);font-size:14px;color:#ffd21f;pointer-events:none;overflow:hidden}
.sbtn i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffe45c,#f5a000);height:0%}
.sbtn b{position:relative;z-index:1}
.sbtn.ready{box-shadow:0 0 22px #ffd21f;animation:pulse2 .6s infinite alternate}
@keyframes pulse2{from{transform:scale(1)}to{transform:scale(1.08)}}
.abtn{position:absolute;right:22px;bottom:60px;width:120px;height:120px;border-radius:50%;border:4px solid var(--line);background:rgba(255,80,80,.55);display:none;align-items:center;justify-content:center;font-family:var(--fh);font-size:16px;color:#fff;pointer-events:none}
.touch .sbtn,.touch .abtn{display:flex}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;width:74px;text-align:center;will-change:transform}
.lbl .ln{font-size:11px;font-weight:900;text-shadow:0 1px 0 #000,0 0 4px #000;white-space:nowrap;line-height:1.1}
.lbl .lh{height:9px;background:#111322;border-radius:4px;padding:1.5px;margin-top:1px}
.lbl .lh i{display:block;height:100%;border-radius:3px;background:#48e06a}
.lbl .la{display:flex;gap:2px;margin-top:2px}
.lbl .la b{display:block;flex:1;height:5px;background:#111322;border-radius:2px;overflow:hidden;position:relative}
.lbl .la b::after{content:"";position:absolute;left:0;top:0;bottom:0;width:inherit;background:#ff8c2a}
.lbl .lg{font-family:var(--fh);font-size:12px;text-shadow:0 1px 0 #000;height:14px}
.lbl.sup::before{content:"SUPER!";display:block;font-family:var(--fh);font-size:10px;color:#ffd21f;text-shadow:0 1px 0 #000;animation:pulse2 .5s infinite alternate}
.dmg{position:absolute;left:0;top:0;font-family:var(--fh);font-size:18px;text-shadow:0 2px 0 #000,0 0 6px #000;white-space:nowrap;will-change:transform}
.pchint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:#cfe3ff;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:8px}
.touch .pchint{display:none}
/* RESULT */
.resbg{position:absolute;inset:0;background:linear-gradient(100deg,#2a7bff 0 50%,#ff5050 50% 100%)}
.resbg.lose{background:linear-gradient(100deg,#ff5050 0 50%,#2a7bff 50% 100%)}
.resbig{position:absolute;top:26px;left:30px;font-family:var(--fh);font-size:58px;font-style:italic;text-shadow:0 4px 0 var(--line),0 8px 16px rgba(0,0,0,.4);transform:rotate(-4deg)}
.resmode{position:absolute;top:100px;left:34px;font-family:var(--fh);font-size:18px}
#resultCanvas{position:absolute;inset:0;width:100%;height:100%}
.resinfo{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);display:flex;gap:10px}
.resinfo .pill{font-size:20px}
.resbtn{position:absolute;right:20px;bottom:20px}
@media (max-width:700px){
 .detail{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}
 .detail .dc{grid-column:1/3;grid-row:1;height:210px}
 .detail .dl,.detail .dr{overflow-y:auto;grid-row:2}
 .title{font-size:24px}.fname{font-size:20px}
 .playbtn{width:120px;height:66px;font-size:26px}.eventSel{min-width:160px}.passBox{min-width:150px}
 .sq{width:64px;height:62px;font-size:12px}
 .badgeTop{top:150px}
}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<div class="screen on" id="home">
 <div class="bg"></div>
 <canvas id="homeCanvas"></canvas>
 <div class="ui" style="pointer-events:none">
  <div class="topbar" style="pointer-events:auto">
   <div class="profile"><div class="av"><canvas id="avCanvas" width="46" height="46"></canvas></div>
    <div><div class="nm" id="pName">플레이어</div><div class="tr"><svg class="ico" width="18" height="18" viewBox="0 0 24 24"><path d="M5 3h14v3a5 5 0 0 1-3 4.6V13h2v3h-2v2h-8v-2H6v-3h2v-2.4A5 5 0 0 1 5 6zM3 5h2v2a3 3 0 0 1-2 0zm18 0h-2v2a3 3 0 0 0 2 0z" fill="#ffd21f" stroke="#111322" stroke-width="1.5"/></svg><span id="pTrophies">0</span></div></div></div>

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt; r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255); return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'); }

const EVENT_SLOTS=['gemgrab','survival','ballrush','heist','hotzone','knockout'];
function eventRotation(){ // rotates map every 24h, each slot offset
  const day=Math.floor(Date.now()/86400000), out=[];
  EVENT_SLOTS.forEach((m,i)=>{ const md=MODES[m]; out.push({mode:m,map:md.maps[(day+i)%md.maps.length],ends:(day+1)*86400000+i*3600000*2}); });
  return out;
}
function timeLeft(ms){ const d=Math.max(0,ms-Date.now()); const h=Math.floor(d/3600000),m=Math.floor(d%3600000/60000); return h>0?`${h}시간 ${m}분`:`${m}분`; }

}

function rollDrop(min){ const order=Object.keys(RARITY); const mi=order.indexOf(min||'basic'); let pool=DROP_ODDS.filter((o)=>order.indexOf(o[0])>=mi); let tot=pool.reduce((a,o)=>a+o[1],0), r=Math.random()*tot; for(const o of pool){ if(r<o[1])return o[0]; r-=o[1]; } return pool[pool.length-1][0]; }
function dropReward(rar){
  const locked=FIGHTERS.filter(f=>!S.fighters[f.id]);
  switch(rar){
    case 'basic': return Math.random()<.5?{t:'coin',n:rint(50,150)}:{t:'pp',n:rint(20,50)};
    case 'rare': return Math.random()<.5?{t:'coin',n:rint(150,300)}:{t:'pp',n:rint(50,100)};
    case 'superrare': return Math.random()<.6?{t:'gem',n:rint(10,25)}:{t:'pp',n:rint(100,160)};
    case 'epic': { const c=locked.filter(f=>f.rarity==='rare'||f.rarity==='superrare'); return c.length&&Math.random()<.5?{t:'fighter',id:c[rint(0,c.length-1)].id}:{t:'gem',n:rint(30,60)}; }
    case 'mythic': { const c=locked.filter(f=>f.rarity==='epic'||f.rarity==='mythic'); return c.length&&Math.random()<.6?{t:'fighter',id:c[rint(0,c.length-1)].id}:{t:'gem',n:rint(80,120)}; }
    default: { const c=locked.filter(f=>f.rarity==='legendary'||f.rarity==='mythic'); return c.length?{t:'fighter',id:c[rint(0,c.length-1)].id}:{t:'gem',n:300}; }
  }
}
let dropState=null;
function openDrop(min){ dropState={min,phase:0,t:0,rar:null,rw:null}; $('#dropRes').textContent='탭해서 열기!'; $('#dropOpen').style.display=''; $('#dropClose').style.display='none'; $('#dropTitle').textContent='럭키 드롭'; openModal('#mDrop'); }
$('#dropOpen').addEventListener('click',()=>{ if(!dropState||dropState.phase)return; dropState.phase=1; dropState.t=0; dropState.rar=rollDrop(dropState.min); dropState.rw=dropReward(dropState.rar); $('#dropOpen').style.display='none'; sfx.super(); });
$('#dropClose').addEventListener('click',()=>{ $('#mDrop').classList.remove('on'); dropState=null; renderHome(); });
function dropLoop(){
  if(dropState&&$('#mDrop').classList.contains('on')){
    const c=$('#dropCanvas'), x=c.getContext('2d'); x.clearRect(0,0,280,280); dropState.t+=1/60; const t=dropState.t;
    const col=dropState.rar?RARITY[dropState.rar].c:'#c24dff';
    const shake=dropState.phase===1&&t<1.6?Math.sin(t*60)*t*4:0;
    const sc=dropState.phase===1&&t>=1.6?1+Math.min(.4,(t-1.6)*2):1;
    x.save(); x.translate(140+shake,150); x.scale(sc,sc);
    if(dropState.phase===1&&t>1.6){ x.globalAlpha=Math.min(1,(t-1.6)*2); for(let i=0;i<12;i++){ const a=i/12*TAU+t; x.strokeStyle=col; x.lineWidth=6; x.beginPath(); x.moveTo(Math.cos(a)*60,Math.sin(a)*60); x.lineTo(Math.cos(a)*(130+Math.sin(t*5+i)*10),Math.sin(a)*(130+Math.sin(t*5+i)*10)); x.stroke(); } x.globalAlpha=1; }
    // box
    x.lineWidth=5; x.strokeStyle='#111322'; x.fillStyle=col; x.beginPath(); x.moveTo(0,-70); x.lineTo(60,-35); x.lineTo(60,35); x.lineTo(0,70); x.lineTo(-60,35); x.lineTo(-60,-35); x.closePath(); x.fill(); x.stroke();
    x.fillStyle=shade(col,60); x.beginPath(); x.moveTo(0,-70); x.lineTo(60,-35); x.lineTo(0,0); x.lineTo(-60,-35); x.closePath(); x.fill(); x.stroke();
    x.fillStyle=shade(col,-60); x.beginPath(); x.moveTo(0,0); x.lineTo(60,-35); x.lineTo(60,35); x.lineTo(0,70); x.closePath(); x.fill(); x.stroke();
    x.restore();
    if(dropState.phase===1&&t>1.6&&!dropState.shown){ dropState.shown=true; const r=dropState.rw; const nm=r.t==='fighter'?`새 파이터 ${FID[r.id].name}!`:`${r.t==='coin'?'코인':r.t==='pp'?'파워 포인트':'젬'} ${r.n}`; $('#dropTitle').textContent=RARITY[dropState.rar].n+' 드롭!'; $('#dropTitle').style.color=col; $('#dropRes').innerHTML=nm; if(r.t==='fighter')unlockFighter(r.id); else giveReward(r); S.drops++; save(); $('#dropClose').style.display=''; sfx.gem(); }
  }

}

/* ============================================================
   BATTLE ENGINE
   ============================================================ */
let G=null, keys={}, mouse={x:0,y:0,down:false,rdown:false};
let seedN=1; function srand(){ seedN=(seedN*16807)%2147483647; return (seedN-1)/2147483646; }

function genMap(mode,mapName){
  let seed=0; for(const ch of mapName) seed=(seed*31+ch.charCodeAt(0))&0xffff; seedN=seed+7;
  const solo=mode==='survival';
  const W=solo?30:19, H=solo?30:29;
  for(let attempt=0;attempt<30;attempt++){
    const m=[]; for(let y=0;y<H;y++){ m.push(new Array(W).fill(0)); }
    const put=(x,y,v)=>{ if(x>=0&&y>=0&&x<W&&y<H) m[y][x]=v; };
    const mirror=(x,y,v)=>{ put(x,y,v); put(W-1-x,y,v); put(x,H-1-y,v); put(W-1-x,H-1-y,v); };
    const nBlocks=solo?60:26;
    for(let i=0;i<nBlocks;i++){ const bw=1+Math.floor(srand()*3), bh=1+Math.floor(srand()*3); const x=Math.floor(srand()*(W/2)), y=Math.floor(srand()*(H/2)); const v=srand()<.55?1:srand()<.75?2:3; for(let a=0;a<bw;a++)for(let b=0;b<bh;b++)mirror(x+a,y+b,v); }
    // crates / bushes for survival
    if(solo){ for(let i=0;i<14;i++){ const x=2+Math.floor(srand()*(W-4)), y=2+Math.floor(srand()*(H-4)); if(m[y][x]===0) m[y][x]=5; } }
    // clear spawns & center
    const cx=Math.floor(W/2), cy=Math.floor(H/2);
    for(let y=cy-2;y<=cy+2;y++)for(let x=cx-3;x<=cx+3;x++)put(x,y,0);
    if(!solo){ for(let x=cx-4;x<=cx+4;x++){ for(let y=0;y<=2;y++){put(x,y,0);put(x,H-1-y,0);} } }
    else { for(let i=0;i<10;i++){ const [sx,sy]=soloSpawn(i,W,H); for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)put(sx+a,sy+b,0); } }
    // mode objects
    if(mode==='gemgrab'||mode==='knockout'||mode==='practice'){ if(mode==='gemgrab') put(cx,cy,6); }
    if(mode==='ballrush'){ for(let x=cx-1;x<=cx+1;x++){ put(x,0,7); put(x,H-1,8); } for(let x=cx-2;x<=cx+2;x++)for(let y=1;y<=2;y++){put(x,y,0);put(x,H-1-y,0);} }
    if(mode==='heist'){ put(cx,2,9); put(cx,H-3,10); for(let x=cx-2;x<=cx+2;x++)for(let y=0;y<=4;y++){ if(m[y][x]!==9)put(x,y,0); if(m[H-1-y][x]!==10)put(x,H-1-y,0);} }
    if(mode==='hotzone'){ for(let y=cy-2;y<=cy+2;y++)for(let x=cx-2;x<=cx+2;x++) if(dist(x,y,cx,cy)<=2.5) put(x,y,11); }
    // connectivity check
    const pass=t=>t===0||t===2||t===5||t===6||t===11||t===9||t===10;
    const seen=new Set(); const q=[[cx,cy]]; seen.add(cx+','+cy);
    while(q.length){ const [x,y]=q.pop(); [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{ const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=W||ny>=H)return; const k=nx+','+ny; if(seen.has(k)||!pass(m[ny][nx]))return; seen.add(k); q.push([nx,ny]); }); }
    let ok=true; if(!solo){ ok=seen.has(cx+','+1)&&seen.has(cx+','+(H-2)); } else { for(let i=0;i<10;i++){ const [sx,sy]=soloSpawn(i,W,H); if(!seen.has(sx+','+sy)){ok=false;break;} } }
    const reach=seen.size/(W*H); if(ok&&reach>0.45) return {w:W,h:H,t:m};
  }
  // fallback: empty map
  const m=[]; for(let y=0;y<H;y++)m.push(new Array(W).fill(0)); if(mode==='gemgrab')m[Math.floor(H/2)][Math.floor(W/2)]=6; return {w:W,h:H,t:m};
}
function soloSpawn(i,W,H){ const a=i/10*TAU; return [Math.round(W/2+Math.cos(a)*(W/2-3)),Math.round(H/2+Math.sin(a)*(H/2-3))]; }
const tileAt=(x,y)=>{ const tx=Math.floor(x/T), ty=Math.floor(y/T); if(tx<0||ty<0||tx>=G.map.w||ty>=G.map.h) return 1; return G.map.t[ty][tx]; };
const solid=(x,y)=>{ const t=tileAt(x,y); return t===1||t===3||t===5||t===9||t===10; }; // walls, water, crates, safes block movement
const blocksBullet=(x,y)=>{ const t=tileAt(x,y); return t===1||t===5||t===9||t===10; };
const blocksBulletNoSafe=(x,y)=>{ const t=tileAt(x,y); return t===1||t===5; };

/* ---- entities ---- */
function mkEnt(fid,team,x,y,isBot,name,power){
  const F=FID[fid], m=powMul(power||1);
  return {id:Math.random().toString(36).slice(2),fid,F,team,x,y,vx:0,vy:0,hp:F.hp*m,maxhp:F.hp*m,ammo:3,sup:0,aim:team===0?-Math.PI/2:Math.PI/2,walk:0,alive:true,respawn:0,isBot,name,power:power||1,m,
    atkCd:0,attacking:0,hurt:0,gems:0,cubes:0,invis:0,slow:0,shield:0,dmgDone:0,kills:0,bot:{goal:null,wander:0,wx:0,wy:0,react:0,dodge:0,dodgeA:0,wa:0},burst:0,burstAng:0,dashing:0,dashA:0,dashKind:'',dashHit:new Set(),stormT:0,inBush:false,minion:false,ttl:0,hitFlash:0,deaths:0};
}
function teamSpawn(team,i){ const w=G.map.w*T,h=G.map.h*T; const x=w/2+(i-1)*T*2.2; return team===0?[x,h-T*1.5]:[x,T*1.5]; }

function startBattle(ev){
  const mode=ev.mode, md=MODES[mode]||{team:1,time:0,name:'연습장'};
  const fid=ev.fid||S.selected;
  G={mode,md,mapName:ev.map,map:genMap(mode,ev.map),ents:[],bullets:[],fx:[],zones:[],gems:[],ball:null,safes:[],time:0,t:0,over:false,score:[0,0],countdown:-1,ended:0,shake:0,cam:{x:0,y:0},zoom:1,banner:'',bannerT:0,round:1,roundT:0,gas:{l:0,r:0,t:0,b:0,timer:0},crates:[],player:null,result:null,startT:3,hotCap:[0,0],party:[],aiming:false,aimAng:0,supAiming:false,supAng:0};
  const w=G.map.w*T,h=G.map.h*T;
  // crates on map
  for(let y=0;y<G.map.h;y++)for(let x=0;x<G.map.w;x++){ if(G.map.t[y][x]===5)G.crates.push({x,y,hp:1200}); if(G.map.t[y][x]===9)G.safes.push({team:1,x:x*T+T/2,y:y*T+T/2,hp:9000,max:9000,tx:x,ty:y}); if(G.map.t[y][x]===10)G.safes.push({team:0,x:x*T+T/2,y:y*T+T/2,hp:9000,max:9000,tx:x,ty:y}); }
  const unlocked=FIGHTERS.filter(f=>S.fighters[f.id]); const pickBot=()=>{ const pool=Math.random()<.5&&unlocked.length>2?unlocked:FIGHTERS; return pool[rint(0,pool.length-1)].id; };
  const pw=S.fighters[fid]?S.fighters[fid].power:1;
  const botPower=Math.max(1,Math.min(11,Math.round(pw+rnd(-1,1))));
  let names=[...BOT_NAMES].sort(()=>Math.random()-.5);
  if(mode==='survival'){
    for(let i=0;i<10;i++){ const [sx,sy]=soloSpawn(i,G.map.w,G.map.h); const isP=i===0; const e=mkEnt(isP?fid:pickBot(),i,sx*T+T/2,sy*T+T/2,!isP,isP?S.name:names.pop(),isP?pw:botPower); G.ents.push(e); if(isP)G.player=e; }
    G.gas={l:0,r:w,t:0,b:h,timer:0}; G.alive=10;
  } else if(mode==='practice'){
    const e=mkEnt(fid,0,w/2,h-T*1.5,false,S.name,pw); G.ents.push(e); G.player=e;
    for(let i=0;i<4;i++){ const d=mkEnt(['brick','sparky','bogle','rico'][i],1,w/2+(i-1.5)*T*3,h/2-T*4,true,'허수아비',pw); d.dummy=true; d.maxhp=d.hp=20000; G.ents.push(d); }
  } else {
    const partyFids=S.party.map(p=>p.fid);
    for(let i=0;i<3;i++){ const [x,y]=teamSpawn(0,i); const isP=i===0; let f=isP?fid:(partyFids[i-1]||pickBot()); const e=mkEnt(f,0,x,y,!isP,isP?S.name:(S.party[i-1]?S.party[i-1].name:names.pop()),isP?pw:botPower); e.spawnI=i; G.ents.push(e); if(isP)G.player=e; }
    for(let i=0;i<3;i++){ const [x,y]=teamSpawn(1,i); const e=mkEnt(pickBot(),1,x,y,true,names.pop(),botPower); e.spawnI=i; G.ents.push(e); }
    if(mode==='ballrush'){ G.ball={x:w/2,y:h/2,vx:0,vy:0,holder:null}; }
    if(mode==='gemgrab'){ G.gemTimer=3; }
    if(mode==='knockout'){ G.time=60; G.roundT=0; }
    if(md.time) G.time=md.time;
  }
  G.cam={x:G.player.x,y:G.player.y};
  build3D();
  $$('.screen').forEach(s=>s.classList.toggle('on',s.id==='battle')); curScreen='battle';
  $('#hud').classList.toggle('touch',isTouch);
  setBanner(mode==='practice'?'연습장 — 자유롭게 연습하세요':`${(MODES[mode]||{}).name||''} · ${ev.map}`,2.5);
  ac(); lastT=performance.now(); requestAnimationFrame(gameLoop);
}
function setBanner(s,t){ G.banner=s; G.bannerT=t; }

/* ---- damage / effects ---- */
function addFx(o){ G.fx.push(o); }
function burst(x,y,col,n=10,sp=4,life=.5,size=4){ for(let i=0;i<n;i++){ const a=Math.random()*TAU,s=Math.random()*sp; addFx({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,ml:life,col,size:size*(0.5+Math.random())}); } }
function ring(x,y,col,r=40,life=.35,w=6){ addFx({k:'ring',x,y,col,r,life,ml:life,w}); }
function dmgText(x,y,n,col='#fff'){ addFx({k:'txt',x,y:y-40,txt:String(Math.round(n)),col,life:.8,ml:.8,vy:-50}); }
function damage(target,amt,src,knock){
  if(!target.alive||target.dummy&&false) return;
  if(target.shield>0){ amt*=.4; }
  if(target.invT>0) return;
  target.hp-=amt; target.hurt=.12; target.hitFlash=.12;
  if(src&&src.team!==target.team){ src.dmgDone+=amt; if(!target.dummy||true) src.sup=Math.min(100,src.sup+amt/ (src.F.hp*src.m) *100*0.72*(src.F.sup.rate||1)); if(target.dummy&&target.hp<target.maxhp*.3){target.hp=target.maxhp;} }
  if(target.invis>0&&target===G.player){} 
  dmgText(target.x,target.y,amt,src&&src.team===0?'#ffd21f':'#ff6060');
  burst(target.x,target.y-20,'#ff4040',6,3,.3,3);
  if(knock){ target.vx+=Math.cos(knock.a)*knock.f; target.vy+=Math.sin(knock.a)*knock.f; }
  if(target.hp<=0&&target.alive){ kill(target,src); }
  if(target===G.player){ G.shake=Math.max(G.shake,3); sfx.hit(); }
}
function heal(t,amt,src){ if(!t.alive)return; const b=t.hp; t.hp=Math.min(t.maxhp,t.hp+amt); if(t.hp>b){ dmgText(t.x,t.y,t.hp-b,'#58e06e'); burst(t.x,t.y-20,'#8cff9e',5,2,.4,3); if(src)src.sup=Math.min(100,src.sup+(t.hp-b)/t.maxhp*40); } }
function kill(e,src){
  e.alive=false; e.hp=0; e.deaths++; burst(e.x,e.y-20,'#fff',16,6,.7,5); ring(e.x,e.y-10,'#ffd21f',60,.5,8); sfx.die();
  if(src&&src.team!==e.team){ src.kills++; if(src===G.player)setBanner('처치! '+e.name,1.2); }
  if(G.mode==='gemgrab'){ for(let i=0;i<e.gems;i++){ const a=Math.random()*TAU; G.gems.push({x:e.x+Math.cos(a)*30,y:e.y+Math.sin(a)*30,vx:Math.cos(a)*3,vy:Math.sin(a)*3,t:0}); } e.gems=0; }
  if(G.mode==='ballrush'&&G.ball.holder===e){ G.ball.holder=null; G.ball.x=e.x; G.ball.y=e.y; }
  if(G.mode==='survival'){ G.alive--; if(e===G.player){ G.playerRank=G.alive+1; } for(let i=0;i<e.cubes;i++){ const a=Math.random()*TAU; G.gems.push({x:e.x+Math.cos(a)*30,y:e.y+Math.sin(a)*30,vx:Math.cos(a)*3,vy:Math.sin(a)*3,t:0,cube:true}); } if(!e.minion&&e.alive===false){ /* removed */ } }
  if(G.mode==='knockout'||G.mode==='survival'||e.minion){ e.respawn=-1; } else e.respawn=3;
}

/* ---- trajectory tracing (bold aim line) ---- */
function tracePath(x,y,a,range,bounces,blocker){
  const pts=[{x,y}]; let cx=x,cy=y,dx=Math.cos(a),dy=Math.sin(a),left=range,b=bounces||0;
  const step=4;
  while(left>0){ const nx=cx+dx*step, ny=cy+dy*step;
    if(blocker(nx,ny)){ if(b>0){ // reflect: find axis
        const hx=blocker(nx,cy), hy=blocker(cx,ny); if(hx&&!hy)dx=-dx; else if(hy&&!hx)dy=-dy; else {dx=-dx;dy=-dy;} b--; pts.push({x:cx,y:cy}); continue; } else break; }
    cx=nx;cy=ny;left-=step; }
  pts.push({x:cx,y:cy}); return pts;
}


/* ---- firing ---- */
function fire(e,a,sup){
  const F=e.F, A=sup?F.sup:F.atk, m=e.m; e.aim=a; e.attacking=.18; if(e.invis>0&&!sup){e.invis=Math.min(e.invis,.8);}
  if(!sup){ e.ammo-=1; e.atkCd=0.25; } else { e.sup=0; sfx.super(); ring(e.x,e.y-10,'#ffd21f',50,.4,8); }
  if(e===G.player||dist(e.x,e.y,G.player.x,G.player.y)<500) sfx.shoot();
  const sx=e.x+Math.cos(a)*18, sy=e.y-14+Math.sin(a)*8;
  addFx({k:'flash',x:sx,y:sy,a,life:.08,ml:.08,col:sup?'#ffd21f':'#fff'});
  const k=A.kind;
  const mkB=(ang,o={})=>G.bullets.push(Object.assign({x:sx,y:sy,vx:Math.cos(ang)*A.speed*60,vy:Math.sin(ang)*A.speed*60,dmg:A.dmg*m,team:e.team,owner:e,range:A.range,trav:0,w:A.w||5,kind:k,bounces:A.bounces||0,pierce:k==='pierce',hit:new Set(),trail:[],sup,knock:A.knock||0,col:sup?'#ffd21f':F.look.accent},o));
  switch(k){
    case 'spread': case 'bouncespray': for(let i=0;i<A.n;i++){ mkB(a+(i-(A.n-1)/2)*(A.spread/(A.n-1)),{kind:k==='bouncespray'?'bounce':'pellet',bounces:A.bounces||0}); } break;
    case 'single': case 'pierce': case 'bounce': mkB(a); break;
    case 'healorb': mkB(a,{heal:A.heal*m}); break;
    case 'burst': e.burst=A.n; e.burstAng=a; e.burstT=0; break;
    case 'boomerang': mkB(a,{boom:true,out:true,owner:e}); break;
    case 'lob': case 'cloud': case 'garden': case 'mine': { const r=A.range; const tx=e.x+Math.cos(a)*r, ty=sy+Math.sin(a)*r; G.bullets.push({x:sx,y:sy,sx,sy,tx,ty,t:0,dur:A.dur||.75,kind:'lob',sub:k,dmg:(A.dmg||0)*m,heal:(A.heal||0)*m,radius:A.radius,team:e.team,owner:e,sup,col:sup?'#ffd21f':F.look.accent,fuse:A.fuse}); break; }
    case 'melee': { const hit=[]; for(const o of G.ents){ if(!o.alive||o.team===e.team)continue; const d=dist(e.x,e.y,o.x,o.y); if(d>A.range+PR)continue; let da=Math.atan2(o.y-e.y,o.x-e.x)-a; da=Math.atan2(Math.sin(da),Math.cos(da)); if(Math.abs(da)<=A.arc/2+.2) hit.push(o); } addFx({k:'arc',x:e.x,y:e.y-10,a,r:A.range,arc:A.arc,life:.2,ml:.2,col:'#fff'}); hit.forEach(o=>damage(o,A.dmg*m,e,{a:Math.atan2(o.y-e.y,o.x-e.x),f:4})); hitCrateArc(e,a,A); break; }
    case 'beam': { const pts=tracePath(sx,sy,a,A.range,0,blocksBullet); const end=pts[pts.length-1]; addFx({k:'beam',x1:sx,y1:sy,x2:end.x,y2:end.y,w:A.w,life:.18,ml:.18,col:'#d8a8ff'}); for(const o of G.ents){ if(!o.alive||o.team===e.team)continue; if(pointSegDist(o.x,o.y-10,sx,sy,end.x,end.y)<A.w+PR) damage(o,A.dmg*m,e); } hitSafeLine(e,sx,sy,end.x,end.y,A.dmg*m); break; }
    case 'chain': { const pts=tracePath(sx,sy,a,A.range,0,blocksBullet); const end=pts[pts.length-1]; let first=null,bd=1e9; for(const o of G.ents){ if(!o.alive||o.team===e.team)continue; const d=pointSegDist(o.x,o.y-10,sx,sy,end.x,end.y); if(d<PR+8){ const dd=dist(sx,sy,o.x,o.y); if(dd<bd){bd=dd;first=o;} } } addFx({k:'bolt',pts:[{x:sx,y:sy},first?{x:first.x,y:first.y-10}:end],life:.2,ml:.2,col:'#ffe94a'}); if(first){ damage(first,A.dmg*m,e); const done=new Set([first]); let cur=first; for(let j=0;j<A.jumps;j++){ let nx=null,nd=1e9; for(const o of G.ents){ if(!o.alive||o.team===e.team||done.has(o))continue; const d=dist(cur.x,cur.y,o.x,o.y); if(d<A.jumpRange&&d<nd){nd=d;nx=o;} } if(!nx)break; addFx({k:'bolt',pts:[{x:cur.x,y:cur.y-10},{x:nx.x,y:nx.y-10}],life:.2,ml:.2,col:'#ffe94a'}); damage(nx,A.dmg*m*.8,e); done.add(nx); cur=nx; } } else hitSafeLine(e,sx,sy,end.x,end.y,A.dmg*m); break; }
    case 'dash': case 'charge': e.dashing=A.dist; e.dashA=a; e.dashKind=k; e.dashSpd=A.speed; e.dashDmg=A.dmg*m; e.dashHit=new Set(); e.invT=0.1; break;
    case 'nova': { ring(e.x,e.y-10,'#ff7fb0',A.radius,.4,10); burst(e.x,e.y-10,'#5cc066',24,8,.6,5); for(const o of G.ents){ if(!o.alive||o.team===e.team)continue; if(dist(e.x,e.y,o.x,o.y)<A.radius+PR) damage(o,A.dmg*m,e,{a:Math.atan2(o.y-e.y,o.x-e.x),f:6}); } break; }
    case 'storm': e.stormT=A.dur; e.stormR=A.radius; e.stormDmg=A.dmg*m; break;
    case 'invis': e.invis=A.dur; break;
    case 'drones': for(let i=0;i<A.n;i++){ const d=mkEnt('tango',e.team,e.x+rnd(-20,20),e.y+rnd(-20,20),true,'벌',e.power); d.minion=true; d.maxhp=d.hp=600*m; d.ttl=A.dur; d.drone=true; d.owner=e; d.droneDmg=A.dmg*m; G.ents.push(d); } break;
    case 'clone': { const d=mkEnt('obsi',e.team,e.x+rnd(-20,20),e.y+rnd(-20,20),true,'분신',e.power); d.minion=true; d.maxhp=d.hp=A.hp*m; d.ttl=A.dur; d.owner=e; d.scale=.7; G.ents.push(d); break; }
    case 'blink': { const r=A.dist; let tx=e.x+Math.cos(a)*r, ty=e.y+Math.sin(a)*r; let tr=r; while(tr>0&&solid(tx,ty)){ tr-=8; tx=e.x+Math.cos(a)*tr; ty=e.y+Math.sin(a)*tr; } burst(e.x,e.y-20,'#4a4a66',14,5,.5,5); e.x=tx; e.y=ty; ring(e.x,e.y-10,'#ff3a3a',A.radius,.4,10); burst(e.x,e.y-20,'#ff3a3a',20,7,.5,4); for(const o of G.ents){ if(!o.alive||o.team===e.team)continue; if(dist(e.x,e.y,o.x,o.y)<A.radius+PR) damage(o,A.dmg*m,e); } break; }
  }
}
function pointSegDist(px,py,x1,y1,x2,y2){ const dx=x2-x1,dy=y2-y1; const l2=dx*dx+dy*dy||1; let t=((px-x1)*dx+(py-y1)*dy)/l2; t=clamp(t,0,1); return dist(px,py,x1+dx*t,y1+dy*t); }
function hitCrateArc(e,a,A){ for(const c of G.crates){ const cx=c.x*T+T/2,cy=c.y*T+T/2; if(dist(e.x,e.y,cx,cy)<A.range+T/2) hitCrate(c,A.dmg*e.m,e); } for(const s of G.safes){ if(s.team!==e.team&&dist(e.x,e.y,s.x,s.y)<A.range+T/2) hitSafe(s,A.dmg*e.m,e); } }
function hitSafeLine(e,x1,y1,x2,y2,d){ for(const s of G.safes){ if(s.team!==e.team&&pointSegDist(s.x,s.y,x1,y1,x2,y2)<T*.7) hitSafe(s,d,e); } }
function hitCrate(c,d,src){ c.hp-=d; burst(c.x*T+T/2,c.y*T+T/2,'#c98a5a',8,4,.4,4); if(c.hp<=0){ G.map.t[c.y][c.x]=0; G.crates.splice(G.crates.indexOf(c),1); G.gems.push({x:c.x*T+T/2,y:c.y*T+T/2,vx:0,vy:0,t:0,cube:true}); ring(c.x*T+T/2,c.y*T+T/2,'#ffd21f',40,.4,6); } }
function hitSafe(s,d,src){ s.hp-=d; if(src)src.dmgDone+=d; burst(s.x,s.y,'#ffd21f',6,3,.3,3); dmgText(s.x,s.y,d,'#ffd21f'); if(s.hp<=0){ s.hp=0; endBattle(s.team===0?1:0); } }
function explode(b){
  ring(b.x,b.y,b.col,b.radius,.4,8); burst(b.x,b.y,b.col,18,7,.6,5); if(b.sub==='cloud'){ G.zones.push({x:b.x,y:b.y,r:b.radius,life:4,kind:'cloud',dmg:b.dmg,team:b.team,owner:b.owner,col:'#e04a4a'}); return; } if(b.sub==='garden'){ G.zones.push({x:b.x,y:b.y,r:b.radius,life:4,kind:'garden',heal:b.heal,team:b.team,owner:b.owner,col:'#ff5c9e'}); return; }
  for(const o of G.ents){ if(!o.alive||o.team===b.team)continue; if(dist(b.x,b.y,o.x,o.y-10)<b.radius+PR) damage(o,b.dmg,b.owner,{a:Math.atan2(o.y-b.y,o.x-b.x),f:3}); }
  for(const c of G.crates){ if(dist(b.x,b.y,c.x*T+T/2,c.y*T+T/2)<b.radius+T/2) hitCrate(c,b.dmg,b.owner); }
  for(const s of G.safes){ if(s.team!==b.team&&dist(b.x,b.y,s.x,s.y)<b.radius+T/2) hitSafe(s,b.dmg,b.owner); }
  if(dist(b.x,b.y,G.player.x,G.player.y)<300) G.shake=Math.max(G.shake,b.sup?8:4);
}

/* ---- movement ---- */
function moveEnt(e,dx,dy,dt){
  const sp=e.F.spd*T*1.35*(e.slow>0?.6:1)*(e.cubes?1+e.cubes*.03:1);
  let vx=dx*sp, vy=dy*sp; vx+=e.vx*60; vy+=e.vy*60; e.vx*=0.82; e.vy*=0.82;
  e.walk=Math.hypot(dx,dy)>.1?1:0;
  let nx=e.x+vx*dt; if(!circleHits(nx,e.y)) e.x=nx; let ny=e.y+vy*dt; if(!circleHits(e.x,ny)) e.y=ny;
  if(e.walk&&!G.aiming&&!(e.atkCd>0)&&e.attacking<=0) e.aim=Math.atan2(dy,dx);
}
function circleHits(x,y){ for(const [ox,oy] of [[-PR,0],[PR,0],[0,-PR],[0,PR],[-PR*.7,-PR*.7],[PR*.7,-PR*.7],[-PR*.7,PR*.7],[PR*.7,PR*.7]]){ if(solid(x+ox,y+oy))return true; } return false; }
function los(x1,y1,x2,y2){ const d=dist(x1,y1,x2,y2); const n=Math.ceil(d/8); for(let i=1;i<n;i++){ const t=i/n; if(blocksBullet(x1+(x2-x1)*t,y1+(y2-y1)*t))return false; } return true; }
function inBush(e){ return tileAt(e.x,e.y)===2; }

/* ---- AI ---- */
function botThink(e,dt){
  const B=e.bot; B.react-=dt;

    let tg=null,td=1e9; for(const o of G.ents){ if(!o.alive||o.team===e.team||o.minion)continue; const d=dist(e.x,e.y,o.x,o.y); if(d<td){td=d;tg=o;} }
    if(tg){ const a=Math.atan2(tg.y-e.y,tg.x-e.x); e.aim=a; if(td>24) moveEnt(e,Math.cos(a)*1.3,Math.sin(a)*1.3,dt); else { e.walk=0; if(e.atkCd<=0){ damage(tg,e.droneDmg,e.owner); e.atkCd=.6; burst(tg.x,tg.y-10,'#ffcf2a',4,3,.3,3);} } } else e.walk=0; return;
  }

  let tg=null,td=1e9; for(const o of G.ents){ if(!o.alive||o.team===e.team||o.minion&&e.minion)continue; if(o.invis>0&&dist(e.x,e.y,o.x,o.y)>60)continue; if(inBush(o)&&dist(e.x,e.y,o.x,o.y)>110)continue; const d=dist(e.x,e.y,o.x,o.y); if(d<td){td=d;tg=o;} }
  const F=e.F, A=F.atk; const rangeAtk=A.range||A.dist||200;
  // objective
  let gx=null,gy=null;
  const w=G.map.w*T,h=G.map.h*T;
  if(e.minion&&e.owner){ if(tg&&td<300){gx=tg.x;gy=tg.y;} else {gx=e.owner.x;gy=e.owner.y;} }
  else if(G.mode==='gemgrab'){ let ng=null,nd=1e9; for(const gm of G.gems){ const d=dist(e.x,e.y,gm.x,gm.y); if(d<nd){nd=d;ng=gm;} } if(ng&&nd<400){gx=ng.x;gy=ng.y;} else {gx=w/2+Math.sin(G.t*.3+e.spawnI)*T*2;gy=h/2+(e.team===0?T*2:-T*2);} if(e.gems>=3&&e.hp<e.maxhp*.5){ gy=e.team===0?h-T*3:T*3; gx=e.x; } }
  else if(G.mode==='ballrush'){ const b=G.ball; const goalY=e.team===0?T*1:h-T*1; if(b.holder===e){ gx=w/2; gy=goalY; if(dist(e.x,e.y,w/2,goalY)<T*4&&e.atkCd<=0){ kickBall(e,Math.atan2(goalY-e.y,w/2-e.x)); } } else if(!b.holder||b.holder.team!==e.team){ gx=b.x; gy=b.y; } else { gx=b.x+(e.spawnI-1)*T*2; gy=b.y+(e.team===0?-T*2:T*2); } }
  else if(G.mode==='heist'){ const s=G.safes.find(s=>s.team!==e.team); if(e.spawnI===0&&G.safes.find(s=>s.team===e.team)){ const ms=G.safes.find(s=>s.team===e.team); gx=ms.x+T*2; gy=ms.y+(e.team===0?-T*3:T*3); if(tg&&td<rangeAtk)gx=null; } if(gx===null&&s){ gx=s.x+(e.spawnI-1)*T*1.5; gy=s.y+(e.team===0?T*3:-T*3); if(dist(e.x,e.y,s.x,s.y)<rangeAtk*.8&&e.ammo>=1&&e.atkCd<=0&&los(e.x,e.y,s.x,s.y)){ fire(e,Math.atan2(s.y-e.y,s.x-e.x),false); } } }
  else if(G.mode==='hotzone'){ gx=w/2+Math.cos(e.spawnI*2+G.t*.5)*T; gy=h/2+Math.sin(e.spawnI*2+G.t*.5)*T; }
  else if(G.mode==='survival'){ let nc=null,nd=1e9; for(const c of G.crates){ const d=dist(e.x,e.y,c.x*T+T/2,c.y*T+T/2); if(d<nd){nd=d;nc=c;} } for(const gm of G.gems){ const d=dist(e.x,e.y,gm.x,gm.y); if(d<nd){nd=d;nc={x:gm.x/T-.5,y:gm.y/T-.5};} } if(nc&&nd<T*7){gx=nc.x*T+T/2;gy=nc.y*T+T/2; if(nd<T*1.4&&e.ammo>=1&&e.atkCd<=0&&G.crates.includes(nc)) fire(e,Math.atan2(gy-e.y,gx-e.x),false);} else { gx=clamp(e.x,G.gas.l+T*2,G.gas.r-T*2); gy=clamp(e.y,G.gas.t+T*2,G.gas.b-T*2); if(e.x<G.gas.l+T*2||e.x>G.gas.r-T*2||e.y<G.gas.t+T*2||e.y>G.gas.b-T*2){ gx=(G.gas.l+G.gas.r)/2; gy=(G.gas.t+G.gas.b)/2; } } if(tg&&td>rangeAtk*1.3&&e.hp>e.maxhp*.6&&td<rangeAtk*2){gx=tg.x;gy=tg.y;} }
  else { if(tg){gx=tg.x;gy=tg.y;} }
  // combat movement overrides
  if(tg){ const melee=A.kind==='melee'||A.kind==='beam'; const want=melee?rangeAtk*.6:rangeAtk*.75; if(td<want*.6&&!melee&&e.hp<e.maxhp*.6){ gx=e.x-(tg.x-e.x); gy=e.y-(tg.y-e.y); } else if(td<rangeAtk&&(melee||!G.mode.match(/gemgrab|ballrush/)||e.ammo>=2)){ gx=tg.x; gy=tg.y; if(!melee&&td<want){ gx=e.x; gy=e.y; } } }

  else if(gx!==null){ const d=dist(e.x,e.y,gx,gy); if(d>12){ let a=Math.atan2(gy-e.y,gx-e.x); // obstacle probe
      B.wander-=dt; if(circleHits(e.x+Math.cos(a)*22,e.y+Math.sin(a)*22)){ if(B.wander<=0){ B.wa=a+(Math.random()<.5?1:-1)*Math.PI/2; B.wander=.6; } a=B.wa; } dx=Math.cos(a); dy=Math.sin(a); } }

    const canSee=A.kind==='lob'||A.kind==='mine'||A.kind==='boomerang'||los(e.x,e.y,tg.x,tg.y);
    if(td<rangeAtk+10&&canSee&&e.ammo>=1&&e.atkCd<=0&&e.burst<=0&&e.dashing<=0){ fire(e,a+rnd(-.08,.08),false); }
    if(e.sup>=100&&td<(F.sup.range||F.sup.dist||F.sup.radius||200)+20&&canSee&&(F.sup.kind!=='garden'||e.hp<e.maxhp*.6)){ fire(e,a,true); }
  }
}

/* ---- ball ---- */
function kickBall(e,a){ const b=G.ball; b.holder=null; b.x=e.x+Math.cos(a)*22; b.y=e.y+Math.sin(a)*22; b.vx=Math.cos(a)*14; b.vy=Math.sin(a)*14; b.lastKick=e; e.atkCd=.4; e.attacking=.2; e.ammoLock=0; burst(b.x,b.y,'#fff',6,3,.3,3); }

/* ---- update ---- */
let lastT=0;
function gameLoop(now){
  if(curScreen!=='battle'||!G) return;
  let dt=clamp((now-lastT)/1000,0,.05); lastT=now; G.t+=dt;
  if(G.startT>0){ G.startT-=dt; }
  else if(!G.over) update(dt); else { G.ended+=dt; if(G.ended>2.2) showResult(); }
  for(const e of G.ents){ e.hurt-=dt; e.attacking-=dt; }
  updateFx(dt); render3D(); drawHUD(); requestAnimationFrame(gameLoop);
}

function computeResult(win){
  const P=G.player, st=S.fighters[P.fid]; if(G.mode==='practice') return null;
  let dTr=0, tokens=0, txt='';
  if(G.mode==='survival'){ const rank=P.alive?1:(G.playerRank||10); const tbl=[0,10,7,5,3,1,0,-1,-2,-3,-4]; dTr=tbl[rank]||-4; if(st.trophies>500&&dTr>0)dTr=Math.max(1,dTr-3); tokens=rank<=3?20:12; txt=`${rank}위`; win=rank<=4?0:1; }
  else { dTr=win===0?8:win===1?-4:0; if(st.trophies>=600)dTr=win===0?6:-6; if(st.trophies>=900)dTr=win===0?4:-8; tokens=win===0?20:win===1?10:14; txt=win===0?'승리':win===1?'패배':'무승부'; }
  st.trophies=Math.max(0,st.trophies+dTr); S.tokens+=tokens; const coins=win===0?rint(15,30):rint(5,12); S.coins+=coins;
  let star=null,best=-1; for(const e of G.ents){ if(e.minion)continue; if((e.team===(win===0?0:1)||G.mode==='survival')&&e.dmgDone>best){best=e.dmgDone;star=e;} }
  const dropChance=win===0?.22:.08; const drop=Math.random()<dropChance; save();
  return {win,dTr,tokens,coins,txt,star,drop};
}

let resT=0;
function drawResult(){
  if(curScreen!=='result'||!G)return; const c=$('#resultCanvas'); resT+=1/60;
  const teams=[G.ents.filter(e=>!e.minion&&e.team===0),G.ents.filter(e=>!e.minion&&e.team!==0)];
  if(G.mode==='survival'){ teams[0]=[G.player]; teams[1]=G.ents.filter(e=>e!==G.player&&!e.minion).slice(0,3); }
  const won=G.result.win===0; const rigs=[]; const W=c.clientWidth,H=c.clientHeight;
  teams.forEach((tm,ti)=>{ tm.forEach((e,i)=>{ let rig=e._rrig; if(!rig){ rig=e._rrig=buildRig(e.F); } const win=ti===(won?0:1); animRig(rig,{t:resT+i,aim:Math.PI/2+Math.sin(resT*1.5+i)*.4,walk:0,attacking:win&&Math.sin(resT*3+i)>.9}); rig.group.position.set((ti===0?-4.0:1.4)+i*1.3,0,i*-.4); rig.group.scale.setScalar(win?1.08:.95); rigs.push(rig); }); });

  teams.forEach((tm,ti)=>{ tm.forEach((e,i)=>{ const v=e._rrig.group.position.clone(); v.y=-0.25; v.project(studioCam); const px=(v.x+1)/2*W, py=(1-v.y)/2*H+10; x.fillStyle=e===G.result.star?'#ffd21f':'#fff'; const nm=(e===G.result.star?'★ 스타 플레이어\n':'')+e.name; nm.split('\n').forEach((l,li)=>{ x.strokeText(l,px,py+li*16); x.fillText(l,px,py+li*16); }); x.font='900 11px "Noto Sans KR"'; x.fillStyle='#ffe3a0'; const t2=`파워 ${e.power} · 피해 ${Math.round(e.dmgDone)}`; x.strokeText(t2,px,py+36); x.fillText(t2,px,py+36); x.font='900 13px "Noto Sans KR"'; }); });

  const gs=new Set(); for(const gm of G.gems){ gs.add(gm); let m=B.gems.get(gm); if(!m){ m=gm.cube?mk(GEO.box,M('#ffd21f',{emissive:new THREE.Color('#ffb000'),emissiveIntensity:.3,metalness:.3,roughness:.3}),0,0,0,.36,.36,.36):mk(GEO.oct,M('#c24dff',{emissive:new THREE.Color('#8a2ad0'),emissiveIntensity:.5,roughness:.2}),0,0,0,.26,.38,.26); addOutline(m); B.scene.add(m); B.gems.set(gm,m); } m.position.set(gm.x/T,.45+Math.sin(G.t*4+gm.x)*.08,gm.y/T); m.rotation.y=G.t*2; }
  for(const [gm,m] of B.gems){ if(!gs.has(gm)){ B.scene.remove(m); B.gems.delete(gm); } }
  // crates/safes
  for(const [c,m] of B.crateMap){ if(!G.crates.includes(c)){ B.scene.remove(m); B.crateMap.delete(c); } }
  for(const [s,m] of B.safeMap){ m.position.y=s.hp<=0?-2:0; const sc=1+(s.hitT=(s.hitT||0))*0; }
  // ball
  if(B.ball){ const b=G.ball; B.ball.position.set(b.x/T,.3+(b.holder?.35:0),b.y/T); if(!b.holder){ B.ball.rotation.x+=b.vy*0.02; B.ball.rotation.z-=b.vx*0.02; } }
  // zones
  const zs=new Set(); for(const z of G.zones){ zs.add(z); let m=B.zones.get(z); if(!m){ m=new THREE.Mesh(GEO.disc,new THREE.MeshBasicMaterial({color:z.col,transparent:true,opacity:.4,depthWrite:false})); m.rotation.x=-Math.PI/2; m.position.set(z.x/T,.08,z.y/T); m.scale.setScalar(z.r/T); m.renderOrder=1; B.scene.add(m); B.zones.set(z,m); } m.material.opacity=Math.min(1,z.life)*.45; m.rotation.z=G.t; if(Math.random()<.4) addFx({k:'p',x:z.x+rnd(-z.r,z.r)*.8,y:z.y+rnd(-z.r,z.r)*.8,vx:0,vy:0,life:.6,ml:.6,col:z.col,size:4}); }
  for(const [z,m] of B.zones){ if(!zs.has(z)){ B.scene.remove(m); B.zones.delete(z); } }
  // gas
  if(G.mode==='survival'){ const g=G.gas, w=G.map.w, h=G.map.h; const L=g.l/T,Rr=g.r/T,Tt=g.t/T,Bb=g.b/T; const set=(m,x0,x1,z0,z1)=>{ const vis=x1>x0&&z1>z0; m.visible=vis; if(vis){ m.position.set((x0+x1)/2,.6,(z0+z1)/2); m.scale.set(x1-x0,1.2,z1-z0); } }; set(B.gas[0],-1,w+1,-1,Tt); set(B.gas[1],-1,w+1,Bb,h+1); set(B.gas[2],-1,L,Tt,Bb); set(B.gas[3],Rr,w+1,Tt,Bb); }
  // fx
  const fs=new Set(); for(const f of G.fx){ fs.add(f); let o=B.fx.get(f); if(!o){ o=fxObject(f); if(!o)continue; B.fx.set(f,o); } updateFxObj(f,o); }
  for(const [f,o] of B.fx){ if(!fs.has(f)){ removeFxObj(f,o); B.fx.delete(f); } }
  R.render(B.scene,cam);
}
